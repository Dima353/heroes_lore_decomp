name: PlayStation Portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  soundfont:
    uses: ./.github/workflows/soundfont.yml
    with:
      artifact: soundfont-psp

  build:
    needs: soundfont
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundfont-psp
          path: cpp/assets/psp
      - name: Build
        run: |
          docker build -t heroeslore-psp -f cpp/cmake/Dockerfile.psp cpp/cmake
          docker run --rm -v "$PWD:/src" -w /src heroeslore-psp sh tools/build_psp_container.sh
      - name: Collect
        run: |
          mkdir -p out
          cd builds/psp && sudo zip -r ../../out/HeroesLore-psp.zip PSP README.txt SOUNDFONT-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: psp
          path: out/HeroesLore-psp.zip
