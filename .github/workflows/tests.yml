name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run regression tests
        working-directory: cpp
        run: |
          cmake --preset inspect -DHEROES_LORE_BUILD_TESTS=ON -DHEROES_LORE_FETCH_DEPS=ON -DHEROES_LORE_FETCH_SDL=OFF
          cmake --build build-inspect -j4
          ctest --test-dir build-inspect --output-on-failure
