name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  soundfont:
    uses: ./.github/workflows/soundfont.yml
    with:
      artifact: soundfont-windows

  build:
    needs: soundfont
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundfont-windows
          path: cpp/assets/psp
      - name: Build
        working-directory: cpp
        run: |
          cmake --preset windows
          cmake --build --preset windows
      - name: Package
        working-directory: cpp/build-windows
        run: cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: cpp/build-windows/HeroesLore-*-win64.zip
