name: Nintendo Switch

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  soundfont:
    uses: ./.github/workflows/soundfont.yml
    with:
      artifact: soundfont-switch

  build:
    needs: soundfont
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundfont-switch
          path: cpp/assets/psp
      - name: Install tools and libraries
        run: |
          apt-get update && apt-get install -y cmake ninja-build
          dkp-pacman -Sy --noconfirm --needed switch-dev switch-cmake switch-sdl2 switch-zlib
      - name: Build
        working-directory: cpp
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          cmake --preset switch-wsl
          cmake --build --preset switch-wsl
          mkdir -p ../out && cp "$HOME/heroeslore-build/heroes_lore.nro" ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: switch
          path: out/heroes_lore.nro
