name: PortMaster

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  soundfont:
    uses: ./.github/workflows/soundfont.yml
    with:
      artifact: soundfont-portmaster

  build:
    needs: soundfont
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundfont-portmaster
          path: cpp/assets/psp
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 binfmt-support qemu-user-static gcc-aarch64-linux-gnu g++-aarch64-linux-gnu wget
      # Ubuntu 20.04 arm64 sysroot with SDL2 2.32.0 built under qemu (about 10 minutes), cached.
      - uses: actions/cache@v4
        id: sysroot
        with:
          path: ~/sysroot-cache
          key: portmaster-sysroot-${{ hashFiles('tools/make_portmaster_sysroot.sh') }}
      - name: Create sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          sudo sh tools/make_portmaster_sysroot.sh "$HOME/arm64-sysroot"
          mkdir -p ~/sysroot-cache
          sudo tar -C "$HOME" -cf ~/sysroot-cache/arm64-sysroot.tar arm64-sysroot
          sudo chown "$(id -u):$(id -g)" ~/sysroot-cache/arm64-sysroot.tar
      - name: Restore sysroot
        if: steps.sysroot.outputs.cache-hit == 'true'
        run: sudo tar -C "$HOME" -xf ~/sysroot-cache/arm64-sysroot.tar
      - name: Build and package
        working-directory: cpp
        run: |
          export HEROES_LORE_SYSROOT=$HOME/arm64-sysroot
          cmake --preset portmaster
          cmake --build --preset portmaster -j4
          mkdir -p ../out
          python3 ../tools/package_portmaster.py ~/heroeslore-portmaster/heroes_lore ../out/heroeslore-portmaster.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portmaster
          path: out/heroeslore-portmaster.zip
